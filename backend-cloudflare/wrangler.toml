name = "account-manager-backend"
main = "src/index.ts"
compatibility_date = "2024-05-12"

# Binds a Cloudflare KV Namespace to your Worker
# local dev will automatically create a local mock file for OTP_KV
[[kv_namespaces]]
binding = "OTP_KV"
id = "13ac87ee4dd8484faafc9613dce6a795" # ID thực tế của KV trên Cloudflare Dashboard

[vars]
# GAS_WEBHOOK_URL được đưa vào env vars (hoặc có thể dùng wrangler secrets trong production)
# GAS_WEBHOOK_URL = ""
